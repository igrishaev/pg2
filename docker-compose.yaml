services:

  pg15:
    build:
      dockerfile: Dockerfile.15.docker
    command: >
      -E
      -c log_duration=on
      -c log_min_duration_statement=0
    hostname: pg15
    ports:
      - "10150:5432"
    volumes:
      - ./.docker/postgres/initdb.d:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_DB=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_USER=test

